<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyHub 3e Ultra V2</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
header{padding:20px;text-align:center;background:linear-gradient(135deg,#2563eb,#7c3aed)}
nav{display:flex;flex-wrap:wrap;justify-content:center;background:#020617}
nav button{background:none;border:none;color:white;padding:12px;cursor:pointer}
.page{display:none;padding:20px;max-width:1200px;margin:auto}
.active{display:block}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:10px 0}
button{padding:8px 12px;border:none;border-radius:8px;background:#3b82f6;color:white;cursor:pointer}
input{padding:8px;border-radius:8px;border:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
</style>
</head>
<body>
<header>
<h1>🎓 StudyHub 3e Ultra V2</h1>
<p>⭐ XP <span id="xp">0</span> | 🏆 Niveau <span id="lvl">1</span> | 💰 Crédits <span id="credits">100</span></p>
</header>

<nav>
<button onclick="show('home')">🏠 Accueil</button>
<button onclick="show('games')">🎮 Jeux</button>
<button onclick="show('badges')">🏆 Badges</button>
</nav>

<div id="home" class="page active">
<div class="card">
<h2>Version V2</h2>
<p>Ajout de plusieurs jeux, crédits et badges.</p>
</div>
</div>

<div id="games" class="page">
<div class="grid">

<div class="card">
<h3>🎰 Machine à chance</h3>
<button onclick="slot()">Jouer (-10)</button>
<p id="slotR"></p>
</div>

<div class="card">
<h3>🎲 Dé</h3>
<button onclick="dice()">Lancer</button>
<p id="diceR"></p>
</div>

<div class="card">
<h3>✊ Pierre-Feuille-Ciseaux</h3>
<button onclick="rps('Pierre')">Pierre</button>
<button onclick="rps('Feuille')">Feuille</button>
<button onclick="rps('Ciseaux')">Ciseaux</button>
<p id="rpsR"></p>
</div>

<div class="card">
<h3>🔢 Devine le nombre</h3>
<input id="guess">
<button onclick="guessGame()">Tester</button>
<p id="guessR"></p>
</div>

<div class="card">
<h3>🧠 Calcul mental</h3>
<p id="calcQ"></p>
<input id="calcA">
<button onclick="calcCheck()">Valider</button>
<p id="calcR"></p>
</div>

<div class="card">
<h3>⭕ Morpion Solo</h3>
<div id="morpion"></div>
</div>

</div>
</div>

<div id="badges" class="page">
<div class="card">
<h2>🏆 Badges</h2>
<ul id="badgeList">
<li>🥉 Bronze : 100 XP</li>
<li>🥈 Argent : 250 XP</li>
<li>🥇 Or : 500 XP</li>
</ul>
</div>
</div>

<script>
function show(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

let xp=0, lvl=1, credits=100;
function update(){
xpEl.textContent=xp;
lvlEl.textContent=lvl;
document.getElementById('credits').textContent=credits;
}
const xpEl=document.getElementById('xp');
const lvlEl=document.getElementById('lvl');

function gain(v){
xp+=v;
while(xp>=lvl*100) lvl++;
update();
}

function dice(){
diceR.textContent="🎲 "+(Math.floor(Math.random()*6)+1);
gain(2);
}

function rps(c){
let o=["Pierre","Feuille","Ciseaux"][Math.floor(Math.random()*3)];
rpsR.textContent="Ordinateur : "+o;
gain(1);
}

let secret=Math.floor(Math.random()*100)+1;
function guessGame(){
let g=+guess.value;
if(g===secret){guessR.textContent="🎉 Trouvé"; gain(20);}
else guessR.textContent=g<secret?"Plus grand":"Plus petit";
}

let a,b;
function newCalc(){
a=Math.floor(Math.random()*50);
b=Math.floor(Math.random()*50);
calcQ.textContent=a+" + "+b+" = ?";
}
function calcCheck(){
if(+calcA.value===a+b){calcR.textContent="✅"; gain(5);}
else calcR.textContent="❌";
newCalc();
}
newCalc();

function slot(){
if(credits<10){slotR.textContent="Plus assez de crédits";return;}
credits-=10;
let e=["🍒","🍋","⭐","💎"];
let x=e[Math.floor(Math.random()*4)];
let y=e[Math.floor(Math.random()*4)];
let z=e[Math.floor(Math.random()*4)];
let gainCredits=0;
if(x===y&&y===z){gainCredits=100;gain(25);}
else if(x===y||y===z||x===z){gainCredits=25;gain(10);}
credits+=gainCredits;
slotR.innerHTML=x+" "+y+" "+z+"<br>Gain : "+gainCredits;
update();
}

const m=document.getElementById('morpion');
for(let i=0;i<9;i++){
 let b=document.createElement('button');
 b.textContent=' ';
 b.onclick=()=>{if(b.textContent===' '){b.textContent='X';gain(1);}};
 m.appendChild(b);
}
update();
</script>
</body>
</html>
